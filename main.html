<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scifi Screensaver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="stars"></div>

      <div class="topbar">
        <div class="identity-block">
          <div class="identity-name">Carson // System 01</div>
          <div class="identity-divider"></div>
        </div>

        <div class="batterywifi-indicator">
          <span class="indicator-dot">•</span>
          <span id="network">Loading Network...</span>
          <span id="battery">Loading Battery...</span>
        </div>
      </div>

      <div class="hud">
        <h1 id="time">Loading Time...</h1>
        <p id="date">Loading Date...</p>

        <div class="sun-cycle"></div>

        <div class="weather-block">
            <p>WEATHER</p>
            <div id="temperature">Loading Temperature...</div>
            <div id="weather-condition">Loading Condition...</div>
            <div id="highlow">Loading High/Low...</div>
            <div id="wind">Loading Wind...</div>
            <div class="identity-divider"></div>
        </div>

        <div class="outdoor-block">
            <p>OUTDOOR CONDITIONS</p>
            <div class="identity-divider"></div>
        </div>

        <div class="console-block">
            <p>CONSOLE</p>
            <div class="identity-divider"></div>
        </div>

        <div class="network-block">
            <p>NETWORK</p>
            <div class="identity-divider"></div>
        </div>
      </div>
    </div>

    <div class="bottombar">
        <div class="latlon-block">
            <span class="lat-lon">Loading Coordinates...</span>
        </div>
    
        <div class="date-build-block">
            <div class="latlon-divider"></div>
            <span id="dotdate">Loading Date...</span>
            <p>// Build BETA</p>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
