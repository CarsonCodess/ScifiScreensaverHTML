<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scifi Screensaver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="stars"></div>

      <div class="topbar">
        <div class="identity-block">
          <div class="identity-name">Carson // System 01</div>
          <div class="identity-divider"></div>
        </div>

        <div class="batterywifi-indicator">
          <span class="indicator-dot">•</span>
          <span id="network"></span>
          <span id="battery"></span>
        </div>
      </div>

      <div class="hud">
        <h1 id="time"></h1>
        <p id="date"></p>

        <div class="sun-cycle"></div>

        <div class="weather-block">
            <p>WEATHER</p>
            <div class="identity-divider"></div>
        </div>

        <div class="system-block">
            <p>SYSTEM</p>
            <div class="identity-divider"></div>
        </div>

        <div class="console-block">
            <p>CONSOLE</p>
            <div class="identity-divider"></div>
        </div>

        <div class="network-block">
            <p>NETWORK</p>
            <div class="identity-divider"></div>
        </div>

      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
